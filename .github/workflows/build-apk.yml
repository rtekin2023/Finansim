
name: Build Finansim APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract latest Finansim project
        run: |
          test -f Finansim_Turkuaz_Premium_v1_2.zip
          mkdir -p project
          unzip -q -o Finansim_Turkuaz_Premium_v1_2.zip -d project

      - name: Locate Android project
        id: locate
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find project -name settings.gradle -print -quit)
          fi
          if [ -z "$SETTINGS" ]; then
            echo "Android project settings file not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Finansim-Turkuaz-Premium-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
