
name: Build Finansim APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Finansim Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check source ZIP
        run: |
          ls -lh *.zip
          test -f Finansim_2_0_Premium_Kod_Kontrol_Duzeltilmis.zip

      - name: Extract source
        run: |
          mkdir project
          unzip -q Finansim_2_0_Premium_Kod_Kontrol_Duzeltilmis.zip -d project

      - name: Find Android project
        id: locate
        run: |
          SETTINGS=$(find project \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)
          test -n "$SETTINGS"
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          gradle :app:assembleDebug

      - name: Verify APK
        run: |
          test -f "${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Finansim-2.0-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
